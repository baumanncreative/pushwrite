name: PushWrite CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Unit tests
        run: ./scripts/run_pushwrite_unit_tests.sh

      - name: Menu permission refresh test
        run: ./scripts/run_pushwrite_ui_tests.sh

      - name: Cache Whisper model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: models/ggml-large-v3-q5_0.bin
          key: pushwrite-whisper-large-v3-q5-d75795ecff3f83b5

      - name: Fetch verified Whisper model
        run: ./scripts/fetch_whisper_model.sh

      - name: Build static whisper runtime
        run: ./scripts/build_whispercpp_minimal.sh

      - name: Cache local text model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            models/qwen2.5-1.5b-instruct-q4_k_m.gguf
            models/Qwen2.5-LICENSE.txt
            models/local-text-model.sha256
            models/local-text-license.sha256
          key: pushwrite-qwen2.5-1.5b-q4km-183715c435899236

      - name: Fetch verified local text model
        run: ./scripts/fetch_local_text_model.sh

      - name: Build static local text runtime
        run: ./scripts/build_llamacpp_minimal.sh

      - name: Validate offline translation quality
        run: ./scripts/run_local_text_transformation_validation.sh

      - name: Validate Swiss German recognition
        run: ./scripts/run_swiss_german_asr_validation.sh

      - name: Build release app
        run: ./scripts/build_pushwrite_product.sh /tmp/pushwrite-ci-product

      - name: Build isolated QA app
        run: ./scripts/build_pushwrite_product.sh /tmp/pushwrite-ci-qa --qa

      - name: Security boundary regression tests
        run: ./scripts/run_pushwrite_security_regression_tests.sh /tmp/pushwrite-ci-product/PushWrite.app /tmp/pushwrite-ci-qa/PushWrite.app

      - name: Verify bundle and runtime
        run: |
          codesign --verify --deep --strict --verbose=4 /tmp/pushwrite-ci-product/PushWrite.app
          otool -L /tmp/pushwrite-ci-product/PushWrite.app/Contents/Resources/whisper/bin/whisper-cli | tee /tmp/whisper-links.txt
          if grep -F "${GITHUB_WORKSPACE}" /tmp/whisper-links.txt; then
            echo "whisper-cli contains a repository-local dynamic dependency" >&2
            exit 1
          fi
          otool -L /tmp/pushwrite-ci-product/PushWrite.app/Contents/Resources/local-text/bin/llama-completion | tee /tmp/local-text-links.txt
          if grep -F "${GITHUB_WORKSPACE}" /tmp/local-text-links.txt; then
            echo "llama-completion contains a repository-local dynamic dependency" >&2
            exit 1
          fi
          if grep -E '(libcurl|libssl|libcrypto)' /tmp/local-text-links.txt; then
            echo "llama-completion unexpectedly links a network or TLS library" >&2
            exit 1
          fi
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/pushwrite-ci-product/PushWrite.app/Contents/Info.plist)" = "0.3.0"
          test "$(codesign -d --entitlements :- /tmp/pushwrite-ci-product/PushWrite.app 2>/dev/null | plutil -extract 'com\.apple\.security\.device\.audio-input' raw -o - -)" = "true"
          shasum -a 256 -c app/macos/PushWrite/Assets/whisper-model.sha256
          (cd /tmp/pushwrite-ci-product/PushWrite.app/Contents/Resources/local-text/models && shasum -a 256 -c "${GITHUB_WORKSPACE}/app/macos/PushWrite/Assets/local-text-model.sha256")

      - name: Check for common committed secrets
        run: |
          if git grep -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,})'; then
            echo "Potential secret material detected" >&2
            exit 1
          fi
